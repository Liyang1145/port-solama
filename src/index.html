<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>索拉纳港 / 霓港 · PORT SOLANA</title>
<style>
@font-face { font-family: 'Anton'; src: url('assets/Anton-Regular.ttf') format('truetype'), url('Anton-Regular.ttf') format('truetype'); font-display: block; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif; color: #fff; }
canvas#c { display: block; width: 100vw; height: 100vh; }
#hud { position: fixed; inset: 0; pointer-events: none; }
/* v3.4 HUD — GTA6-style corner layout (GTA6_REFERENCE.md §1), original styling */
.fade { transition: opacity .45s ease; }
body.snap .fade { transition: none !important; }
body.photo #hud { display: none !important; }
#tl { position: absolute; left: 26px; top: 22px; display: flex; flex-direction: column; gap: 7px; }
.bar { display: flex; align-items: center; gap: 7px; height: 14px; }
.bar svg { width: 13px; height: 13px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.bar .tr { width: 150px; height: 5px; border-radius: 3px; background: rgba(15,15,22,.42); overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.06); position: relative; }
.bar .tr i { display: block; height: 100%; border-radius: 3px; transition: width .25s; }
.bar .tr b { position: absolute; left: 25%; top: 0; bottom: 0; width: 1.5px; background: rgba(0,0,0,.35); }
#hp i { background: linear-gradient(90deg,#ff4f86,#ff86ad); } #hp svg { fill: #ff6b98; }
#ar i { background: linear-gradient(90deg,#8a6bff,#b9a2ff); } #ar svg { fill: #a88bff; }
#st i { background: linear-gradient(90deg,#3fe0b4,#8ff5d6); } #st svg { fill: #6befc8; }
#tr { position: absolute; right: 30px; top: 22px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
#stars { display: flex; gap: 3px; height: 20px; }
#stars span { width: 19px; height: 19px; display: block; }
#stars span svg { width: 19px; height: 19px; fill: rgba(30,30,36,.45); stroke: rgba(255,255,255,.55); stroke-width: 1.4; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
#stars span.on svg { fill: #fff; stroke: #fff; }
#stars.lost span.on svg { fill: #ff3b4e; stroke: #ff3b4e; }
#stars.lost span.on { animation: fl 1s steps(2) infinite; }
@keyframes fl { 50% { opacity: .55; } }
#evid { display: flex; gap: 4px; height: 16px; }
#evid i { width: 16px; height: 16px; border-radius: 50%; background: #e2263e; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 9px; font-weight: 800; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
#wpn { display: flex; align-items: center; gap: 8px; font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 19px; letter-spacing: .5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
#wpn svg { width: 30px; height: 16px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
#wpn small { font-size: 14px; opacity: .7; }
#money { display: flex; align-items: center; gap: 6px; font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 20px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
#money svg { width: 16px; height: 14px; fill: #4fe08a; }
#cross { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: rgba(255,255,255,.95); box-shadow: 0 0 0 1px rgba(0,0,0,.35); display: none; }
#mm { position: absolute; left: 22px; bottom: 20px; width: 206px; height: 112px; }
#mmc { position: absolute; left: 0; top: 0; width: 206px; height: 112px; border-radius: 10px; }
#msg { position: absolute; left: 26px; top: 64px; font-size: 14px; line-height: 1.45; padding: 9px 13px; background: rgba(12,12,18,.62); border-radius: 6px; opacity: 0; transition: opacity .3s; max-width: 330px; }
#help { position: absolute; left: 26px; top: 64px; font-size: 12.5px; line-height: 1.6; background: rgba(12,12,18,.62); padding: 9px 13px; border-radius: 6px; max-width: 300px; }
#area { position: absolute; right: 30px; bottom: 26px; text-align: right; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8); opacity: 0; }
#area b { display: block; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
#big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Anton', Impact, sans-serif; font-size: 100px; color: #e8384f; text-shadow: 0 4px 12px rgba(0,0,0,.6); opacity: 0; transition: opacity .6s; background: radial-gradient(rgba(0,0,0,0), rgba(0,0,0,.55)); letter-spacing: 6px; }
#veh { position: absolute; left: 236px; bottom: 22px; font-family: 'Anton', Impact, sans-serif; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
#veh small { font-size: 12px; opacity: .75; margin-left: 3px; font-family: sans-serif; }
#load { position: fixed; inset: 0; background: #0b0a10 radial-gradient(circle at 50% 120%, #ff7a59 0, #c2436e 25%, #3b1d4a 55%, #0b0a10 80%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
#load h1 { font-family: 'Anton', Impact, sans-serif; font-size: 72px; margin: 0; letter-spacing: 4px; background: linear-gradient(#ffd6a0, #ff7aa8); -webkit-background-clip: text; color: transparent; }
#load p { opacity: .8; }
#lbar { width: 320px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
#lbar i { display: block; height: 100%; width: 0; background: #fff; }
#start { margin-top: 18px; padding: 10px 26px; border-radius: 22px; border: 0; background: #fff; color: #111; font-size: 16px; cursor: pointer; display: none; pointer-events: auto; }
#maps { display: flex; gap: 22px; margin: 26px 0 10px; }
.mcard { width: 250px; padding: 22px 20px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,10,16,.55); color: #fff; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; font-family: inherit; transition: transform .15s, border-color .15s; }
.mcard:hover { transform: translateY(-3px); border-color: #fff; }
.mcard b { font-size: 26px; letter-spacing: 2px; }
.mcard i { font-style: normal; font-family: 'Anton', Impact, sans-serif; font-size: 15px; letter-spacing: 3px; opacity: .75; }
.mcard span { font-size: 13px; opacity: .8; }
.mcard.gta { background: linear-gradient(160deg, rgba(255,170,110,.35), rgba(30,60,90,.6)); }
.mcard.cy { background: linear-gradient(160deg, rgba(255,40,200,.38), rgba(20,200,255,.25) 60%, rgba(10,8,30,.7)); }
#load.cy { background: #07060f radial-gradient(circle at 50% 120%, #29e3ff 0, #b51ee0 28%, #2a0f4a 58%, #07060f 82%); }
#load.cy h1 { background: linear-gradient(#7ff3ff, #ff5fd2); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="tl" class="fade"><div class="bar" id="hpb"><svg viewBox="0 0 16 16"><path d="M8 14.5 1.6 8.2A3.9 3.9 0 0 1 8 3.3a3.9 3.9 0 0 1 6.4 4.9z"/></svg><div class="tr" id="hp"><i style="width:100%"></i><b></b></div></div><div class="bar" id="arb"><svg viewBox="0 0 16 16"><path d="M8 1 14 3.2v4.3c0 3.6-2.6 6.3-6 7.5C4.6 13.8 2 11.1 2 7.5V3.2z"/></svg><div class="tr" id="ar"><i style="width:40%"></i></div></div><div class="bar" id="stb"><svg viewBox="0 0 16 16"><path d="M9.5 1 3 9h4l-1 6 6.5-8h-4z"/></svg><div class="tr" id="st"><i style="width:100%"></i></div></div></div>
  <div id="help">WASD 移动 · 鼠标 视角 · Shift 冲刺 · 空格 跳跃/手刹<br>F 上车/下车(抢车) · 左键 射击/挥击 · 右键 瞄准 · R 换弹 · C 掩体<br>1–6 / 滚轮 / 按住 Q 武器轮盘 · E 使用商店/ATM · ↑ 或 I 手机 · Z 切换主角<br>. 切换电台 · H 喇叭 · T 快进时间 · V 车内视角 · Tab 显示状态 · Esc 释放鼠标</div>
  <div id="tr"><div id="stars" class="fade"><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span><span><svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg></span></div><div id="evid" class="fade"></div><div id="wpn" class="fade"><svg viewBox="0 0 32 16"><path d="M2 3h24l2 2v3h-9l-1 1h-3l-2 6H6l2-6H4L2 7z"/></svg><span id="ammo">12<small> / 96</small></span></div><div id="money" class="fade"><svg viewBox="0 0 16 14"><rect x="0" y="2" width="16" height="11" rx="2"/><rect x="10" y="6" width="6" height="4" rx="1" fill="#0b3"/></svg><span id="cashv">$5,000</span></div></div>
  <div id="mm" class="fade"><canvas id="mmc" width="412" height="224"></canvas></div>
  <div id="cross"></div>
  <div id="veh" class="fade"></div>
  <div id="area" class="fade"><b>海潮大道</b><span>棕榈海滩 · 18:40</span></div>
  <div id="msg"></div>
  <div id="big"></div>
</div>
<div id="load"><h1 id="ttl">PORT SOLANA</h1><p id="lp">选择地图 <small style="opacity:.6">r6.0</small></p>
  <div id="maps">
    <button data-map="gta" class="mcard gta"><b>索拉纳港</b><i>PORT SOLANA</i><span>写实 · 海湾都市 · 昼夜</span></button>
    <button data-map="cyber" class="mcard cy"><b>霓港</b><i>NEOPORT</i><span>赛博朋克 · 霓虹夜城 · 雨林草原</span></button>
  </div>
  <div id="lbar"><i></i></div><button id="start">进入城市</button></div>
<!--GAMEJS-->
<script>
// r6.0 start menu: pick the map BEFORE the game bundle runs (?map=gta|cyber or #map= skip the menu; headless tests default to gta)
(function () {
  var q = new URLSearchParams(location.search); var m = q.get('map') || (location.hash.match(/map=(\w+)/) || [])[1];
  if (!m && navigator.webdriver && !q.has('menu')) m = 'gta';
  var L = document.getElementById('load');
  function go(id) {
    id = id === 'cyber' ? 'cyber' : 'gta'; window.__PS_MAP = id;
    try { if (!q.get('map')) history.replaceState(null, '', location.pathname + location.search + '#map=' + id); } catch (e) { }
    document.getElementById('maps').style.display = 'none'; document.getElementById('lbar').style.display = 'block';
    document.getElementById('ttl').textContent = id === 'cyber' ? 'NEOPORT' : 'PORT SOLANA';
    document.getElementById('lp').innerHTML = (id === 'cyber' ? '霓港 · 正在载入夜城…' : '索拉纳港 · 正在载入城市…') + ' <small style="opacity:.6">r6.0</small>';
    if (id === 'cyber') L.classList.add('cy');
    document.title = id === 'cyber' ? '霓港 · NEOPORT' : '索拉纳港 · PORT SOLANA';
    var g = document.getElementById('gamejs'); var s = document.createElement('script');
    if (g) s.text = g.textContent; else s.src = 'main.js';
    document.body.appendChild(s);
  }
  window.__PS_GO = go;
  if (m) go(m); else { document.getElementById('lbar').style.display = 'none'; Array.prototype.forEach.call(document.querySelectorAll('#maps button'), function (b) { b.onclick = function () { go(b.getAttribute('data-map')); }; }); }
})();
</script>
</body>
</html>
